function tcall(c){$('#tb').innerHTML='';const e=$('#tc');let n=0;const iv=setInterval(()=>{e.style.transform=`rotateY(${n++*90}deg)`},110);setTimeout(()=>{clearInterval(iv);e.style.transform='';const r=Math.random()<.5?0:1,won=c==r;e.textContent=r?'Tails':'Heads';$('#tr').innerHTML=won?`<h3>It is ${e.textContent}! You won the toss</h3><button class="p" onclick="tpick(1)">Bat first</button> <button class="p" onclick="tpick(0)">Bowl first</button>`:`<h3>It is ${e.textContent} — ${TR.O.name} won the toss</h3>`;if(!won)setTimeout(()=>tpick(Math.random()<.4?0:1),1500)},1300)}
function tpick(x){$('#tr').innerHTML=`<h3>${x?'You bat first':'You bowl first'}</h3>`;setTimeout(()=>TR.res(x?TR.H:TR.O),1000)}
const cur=()=>S.live.filter(Boolean).pop();
function fpUI(I){const e=$('#fp');if(!e)return;if(!S.hw){e.innerHTML='';return}const T=I.bl,m=T.hf?T.fm:'',pp=I.b/6<I.N*.3;e.innerHTML=`<b>Field${pp?' (Powerplay: max 2 outside)':''}:</b> `+[['nor','Normal'],['atk','Attacking'],['def','Defensive'],['cus','Custom']].map(([k,l])=>`<button class="${m==k?'p':''}" onclick="sf('${k}')">${l}</button>`).join('')+` riders <select onchange="sfc(this.value)">${[0,1,2,3,4,5].map(k=>`<option ${k==(T.fc??3)?'selected':''}>${k}</option>`).join('')}</select>`}
function sf(k){const I=cur();I.bl.hf=1;I.bl.fm=k;fpUI(I)}
function sfc(v){const I=cur();I.bl.hf=1;I.bl.fm='cus';I.bl.fc=+v;fpUI(I)}
const MY=Math.random().toString(36).slice(2);let Q=Promise.resolve();
function nin(o){FB.update('rooms/'+S.net.code+'/in',o)}
function bc(I,x){if(!S.net||S.net.g||!window.FB)return;FB.push('rooms/'+S.net.code+'/ev',{k:'b',x:{r:x.r,w:x.w?1:0,x:x.x||0,ang:x.ang},j:[I.bt.j,I.bl.j],sb:$('#sb').innerHTML,cm:$('#cm').innerHTML,sc:$('#scd').innerHTML})}
function remB(I){return new Promise(res=>{const o=I.b/6|0,q=Math.ceil(I.N/5),c={};I.bl.pl.slice(0,o).forEach(p=>c[p.n]=(c[p.n]||0)+1);const prev=I.bl.pl[o-1],el=I.bl.xi.filter(p=>(c[p.n]||0)<q&&p!=prev).sort((a,b)=>b.bowl-a.bowl),id='q'+Date.now(),b='rooms/'+S.net.code;let un=()=>{},done=0;const fin=v=>{if(done)return;done=1;un();if(v&&v.id!=null){const p=el.find(p=>p.id==v.id);if(p)I.bl.pl[o]=p;I.bl.hf=1;I.bl.fm=v.fm||'nor';I.bl.fc=+v.fc}if(!el.includes(I.bl.pl[o]))I.bl.pl[o]=el[0];$('#bp').innerHTML='';res()};$('#bp').innerHTML=`⏳ Waiting for ${I.bl.name} to set over ${o+1}...`;FB.push(b+'/ev',{k:'rq',t:'bowl',id,o,q,def:I.bl.pl[o]?I.bl.pl[o].id:el[0].id,el:el.map(p=>({id:p.id,n:p.n,bl:p.bowl,sp:SPIN.has(p.n)?1:0,u:c[p.n]||0}))});un=FB.on(b+'/rs/'+id,v=>v&&fin(v));setTimeout(()=>fin(null),30000)})}
function remBat(I){return new Promise(res=>{const el=I.bt.xi.map((p,i)=>({p,i})).filter(e=>e.i>=I.s);if(el.length<2)return res();const id='q'+Date.now(),b='rooms/'+S.net.code;let un=()=>{},done=0;const fin=v=>{if(done)return;done=1;un();if(v&&v.i!=null){const j=+v.i,x=I.bt.xi,s=I.sc;if(j>=I.s&&x[j]){[x[I.s],x[j]]=[x[j],x[I.s]];[s[I.s],s[j]]=[s[j],s[I.s]]}}$('#bp').innerHTML='';res()};$('#bp').innerHTML=`⏳ Waiting for ${I.bt.name} to pick the next batter...`;FB.push(b+'/ev',{k:'rq',t:'bat',id,el:el.map(e=>({i:e.i,n:e.p.n,b:e.p.bat}))});un=FB.on(b+'/rs/'+id,v=>v&&fin(v));setTimeout(()=>fin(null),30000)})}
async function netToss(H,O){const w=Math.random()<.5?H:O,bat=Math.random()<.4,f=bat?w:(w==H?O:H),m=`🪙 ${w.name} won the toss and chose to ${bat?'bat':'bowl'} first`;say('System',m);FB.push('rooms/'+S.net.code+'/chat',{u:'System',t:m,id:'sys'});await new Promise(r=>setTimeout(r,1800));return f}
async function netLobby(){const host=S.role!='join',code=S.code||genCode(),b='rooms/'+code,t=S.tm,d={name:t.name,j:t.j,xi:t.xi.map(p=>p.id),bw:t.bw,ov:t.ov,c:t.c,vc:t.vc,wk:t.wk};S.room=code;S.code=code;S.net={code,g:!host};
app(`<h2>🌐 Online Room</h2><div class="card r sp" style="border-color:var(--ac)"><div><div class="mu">Room code</div><div class="big" style="font-size:40px;letter-spacing:8px;color:var(--ac)">${code}</div></div><button id="cpb" onclick="copyCode('${code}')">📋 Copy code</button></div><div class="card"><div class="r sp"><b>Players</b><span class="mu" id="lc"></span></div><div id="lb">Connecting to the online database...</div></div><div id="ls" style="font-weight:700;margin:6px 0"></div><div class="r"><button class="p" id="go" disabled>Start match</button><button onclick="leaveRoom()">Leave room</button></div>`);
try{if(host){await tmo(FB.update(b,{state:'lobby',ts:Date.now()}),10000);await tmo(FB.set(b+'/players/host',d),10000);await tmo(FB.set(b+'/pres/host',{st:'ready'}),10000)}else{const s=await tmo(FB.get(b+'/state'),10000);if(s==null){$('#lb').innerHTML='❌ Room '+code+' was not found (the host may have closed it). Press Leave room and check the code.';return}if(s=='play'){$('#lb').innerHTML='❌ That match has already started.';return}await tmo(FB.set(b+'/players/guest',d),10000);await tmo(FB.set(b+'/pres/guest',{st:'ready'}),10000)}}
catch(e){const to=e.message=='timeout';$('#lb').innerHTML=`<div style="color:#e63946"><b>❌ ${to?'Could not connect to the online database (timed out)':'Database error'}</b></div><div class="mu" style="margin:6px 0">${to?'':esc(e.message)+'<br>'}Check that (1) a Realtime Database exists for this Firebase project, (2) its rules allow read/write on "rooms", and (3) nothing blocks firebaseio.com.</div><button class="p" onclick="netLobby()">Retry</button>`;return}
watchRoom();
S.lobbyDraw=()=>{if(!$('#lb')||!$('#go'))return;const P={...(S.pp||{})},R=S.pr||{},you=host?'host':'guest';P[you]=P[you]||d;const n=(P.host?1:0)+(P.guest?1:0);$('#lb').innerHTML=slot('host',P,R,host)+slot('guest',P,R,!host);$('#lc').textContent=n+' of 2 ready';
if(host){const G=P.guest;if(G){G.name=cleanName(G.name);S.gd=G}$('#go').disabled=!G;$('#ls').textContent=G?'✅ Both players are ready - tap Start match!':R.guest?'🟡 Your friend joined and is choosing their squad...':'⏳ Waiting for your friend - share the room code above'}
else $('#ls').textContent=S.closed?'⚠️ The host closed this room. Press Leave room.':P.host?'✅ Both players are ready - waiting for the host to start the match...':'🟡 Waiting for the host to finish picking their squad...'};
S.lobbyDraw();
NU.push(FB.child(b+'/chat',m=>{if(m.id!=MY){CH.push(m);cu()}}));
if(host){$('#go').onclick=async()=>{await FB.set(b+'/set',{N:S.N,pitch:S.pitch,dim:S.dim});await FB.set(b+'/state','play');netHost(S.gd)}}
else{$('#go').style.display='none';NU.push(FB.on(b+'/state',async s=>{if(s=='play'&&!S.started){S.started=1;Object.assign(S,await FB.get(b+'/set'));guestPlay()}else if(s==null&&!S.started){S.closed=1;S.lobbyDraw&&S.lobbyDraw()}}))}}
async function netHost(g){const b='rooms/'+S.net.code,H=mine(),G=mk(g.name,g.j,g.xi.map(i=>POOL[i]),g.bw,g.c,g.vc,g.ov,g.wk);G.rem=true;S.rg=G;S.rst=1;FB.on(b+'/in',v=>{if(!v)return;if(v.st!=null)S.rst=+v.st;if(v.fm){G.hf=1;G.fm=v.fm;G.fc=+v.fc}});const r=await match(H,G,H);FB.push(b+'/ev',{k:'end',win:r.w==H?'host':'guest',tx:r.tx,a:r.a,b:r.b,mv:`${r.mvp.n} (${r.mvp.t}) — ${Math.round(r.mvp.pts)} pts`});S.res=()=>{S.tm.xi=null;S.net=null;menu()};rscreen(r,H,'S.res')}
function guestPlay(){app(`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div><div class="card" id="sb">Match starting...</div><canvas id="cv" width="640" height="380"></canvas><div class="card" id="cm"></div><div class="card"><div id="stc"></div><div id="bp" style="margin-top:8px"></div><div id="fp" class="r" style="margin-top:8px"></div></div></div><div class="card" id="scd" style="overflow:auto;max-height:700px"></div></div>`);S.spec=false;stUI();gfp();nin({st:S.st});FB.child('rooms/'+S.net.code+'/ev',e=>gev(e))}
function gev(e){Q=Q.then(async()=>{if(e.k=='b'){await play(e.x,{bt:{j:e.j[0]},bl:{j:e.j[1]}});$('#sb').innerHTML=e.sb;$('#cm').innerHTML=e.cm;$('#scd').innerHTML=e.sc}else if(e.k=='rq')await grq(e);else if(e.k=='end')gend(e)})}
function grq(e){return new Promise(res=>{const pn=$('#bp'),b='rooms/'+S.net.code+'/rs/'+e.id;setTimeout(()=>{pn.innerHTML='';res()},30000);if(e.t=='bowl'){pn.innerHTML=`<b>Over ${e.o+1} — choose your bowler:</b> <select id="gb">${e.el.map(p=>`<option value="${p.id}" ${p.id==e.def?'selected':''}>${p.n} (bowl ${p.bl}${p.sp?' · spin':' · pace'}) ${p.u}/${e.q}</option>`).join('')}</select> Field <select id="gf">${[['nor','Normal'],['atk','Attacking'],['def','Defensive'],['cus','Custom']].map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select> riders <select id="gc">${[0,1,2,3,4,5].map(k=>`<option ${k==3?'selected':''}>${k}</option>`).join('')}</select> <button class="p" id="gk">Bowl ▶</button>`;$('#gk').onclick=()=>{FB.set(b,{id:+$('#gb').value,fm:$('#gf').value,fc:+$('#gc').value});pn.innerHTML='';res()}}else{pn.innerHTML=`<b>Wicket! Choose the next batter:</b> <select id="gb">${e.el.map(p=>`<option value="${p.i}">${p.n} (bat ${p.b})</option>`).join('')}</select> <button class="p" id="gk">Send in ▶</button>`;$('#gk').onclick=()=>{FB.set(b,{i:+$('#gb').value});pn.innerHTML='';res()}}})}
function gend(e){const w=e.win=='guest';app(`<div class="card" style="text-align:center"><div class="big">${w?'🏆 YOU WIN!':'💔 You lost'}</div><h3>${e.tx}</h3><div>${e.a}<br>${e.b}</div><p>⭐ <b>Match MVP:</b> ${e.mv}</p><button class="p" onclick="S.net=null;menu()">Main menu</button></div>`)}
function gfp(){$('#fp').innerHTML='<b>Your field (when bowling):</b> '+[['nor','Normal'],['atk','Attacking'],['def','Defensive'],['cus','Custom']].map(([k,l])=>`<button onclick="gf('${k}')">${l}</button>`).join('')+` riders <select onchange="gfc(this.value)">${[0,1,2,3,4,5].map(k=>`<option ${k==3?'selected':''}>${k}</option>`).join('')}</select>`}
function gf(k){nin({fm:k,fc:S.gc??3})}
function gfc(v){S.gc=+v;nin({fm:'cus',fc:+v})}
const _su=stUI;stUI=function(){_su();if(S.net&&S.net.g&&window.FB)nin({st:S.st})};
/* 1v1 & TOUR */
async function start(o){const H=mine(),r=await match(H,o,H);S.res=()=>{S.tm.xi=null;menu()};rscreen(r,H,'S.res')}
function tstart(){const H=mine(),b=S.names.map(n=>bot(n));const T=S.T={H,teams:[H,...b],fix:[],i:0,fin:0,st:{}};for(let i=0;i<T.teams.length;i++)for(let j=i+1;j<T.teams.length;j++)T.fix.push([T.teams[i],T.teams[j]]);T.fix=sh(T.fix);tui()}
function tui(){const T=S.T,t=[...T.teams].sort((a,b)=>b.pts-a.pts||b.w-a.w);const nxt=T.fix.slice(T.i).find(f=>f.includes(T.H)),done=T.i>=T.fix.length;
app(`<h2>🏆 Tournament ${S.on?'(Online)':''}</h2><div class="card"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr>${t.map((x,i)=>`<tr ${x==T.H?'style="font-weight:800"':''}><td>${i+1}</td><td class="r">${jersey(x.j,x.j.num,'',26)}${x.name} <button onclick="tsq(${T.teams.indexOf(x)})">Squad</button></td><td>${x.w+x.l}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pts}</td></tr>`).join('')}</table></div><div class="card"><b>Recent results</b>${(T.res||[]).slice(-8).reverse().map(x=>`<div class="mu">${x}</div>`).join('')||'<div class="mu">No matches played yet</div>'}</div><div class="r"><button onclick="tstats()">📊 Stats</button>${sbtn()}<button onclick="watch()">👀 Watch other matches</button>${done?`<button class="p" onclick="tfin()">Play Final: ${t[0].name} vs ${t[1].name}</button>`:`<button class="p" onclick="tnext()">${nxt?'Play: vs '+(nxt[0]==T.H?nxt[1]:nxt[0]).name:'Finish league'}</button><button onclick="editXI()">Edit XI / Bowling</button>`}</div>`)}
async function tnext(){const T=S.T;while(T.i<T.fix.length){const[a,b]=T.fix[T.i++];if(a==T.H||b==T.H){S.opp=(a==T.H?b:a).name;const r=await match(a,b,T.H);S.res=tui;return rscreen(r,T.H,'S.res')}await match(a,b,null)}tui()}
async function tfin(){const T=S.T,t=[...T.teams].sort((a,b)=>b.pts-a.pts||b.w-a.w),[a,b]=t,h=a==T.H||b==T.H,r=await match(a,b,h?T.H:null),ch=r.w;S.res=menu;app(`<div class="card" style="text-align:center"><div class="big">🏆 CHAMPIONS</div>${jersey(ch.j,ch.j.num,ch.name,200)}<h2>${ch.name}</h2><p>${r.tx}</p><p>${ch==T.H?'You lifted the trophy! 🎉':'Better luck next season.'}</p>${tmvp()}<button class="p" onclick="menu()">Main menu</button></div>`)}
menu();
</script></body></html>
