function scd(){const e=$('#scd');if(!e)return;e.innerHTML='<b>📋 Live Scorecard</b><hr>'+S.live.map(I=>{const bt=I.bt.xi.map((p,i)=>i<I.nx?`<tr><td>${p.n}${I.sc[i].o?'':'*'}</td><td>${I.sc[i].r}</td><td>${I.sc[i].b}</td><td>${I.sc[i].f}</td><td>${I.sc[i].s}</td></tr>`:'').join(''),yb=I.bt.xi.slice(I.nx).map(p=>p.n).join(', '),bw=Object.entries(I.bs).map(([n,b])=>`<tr><td>${n}</td><td>${b.b/6|0}.${b.b%6}</td><td>${b.r}</td><td>${b.w}</td><td>${b.b?(b.r*6/b.b).toFixed(1):'-'}</td></tr>`).join('');return`<div style="font-size:12px"><b>${I.bt.name} ${I.r}/${I.w} (${ov(I)} ov)</b><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>${bt}</table>${yb?`<div class="mu">Yet to bat: ${yb}</div>`:''}<table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th></tr>${bw}</table></div><hr>`}).join('')}
function recS(...Is){const st=S.T.st,g=(p,t)=>st[p.n+'|'+t.name]||(st[p.n+'|'+t.name]={n:p.n,t:t.name,i:0,r:0,b:0,o:0,f:0,s:0,h:0,h5:0,h1:0,bi:0,bb:0,br:0,bw:0,bf:0,bfr:999});Is.forEach(I=>{I.bt.xi.forEach((p,i)=>{if(i>=I.nx)return;const s=I.sc[i],a=g(p,I.bt);a.i++;a.r+=s.r;a.b+=s.b;a.o+=s.o;a.f+=s.f;a.s+=s.s;a.h=Math.max(a.h,s.r);if(s.r>=100)a.h1++;else if(s.r>=50)a.h5++});for(const n in I.bs){const p=I.bl.xi.find(x=>x.n==n),b=I.bs[n],a=g(p,I.bl);a.bi++;a.bb+=b.b;a.br+=b.r;a.bw+=b.w;if(b.w>a.bf||(b.w==a.bf&&b.r<a.bfr)){a.bf=b.w;a.bfr=b.r}}})}
function tstats(k='mv'){const T=S.T,A=Object.values(T.st),D={mv:['Tournament MVP',s=>s.mv||0,s=>s.mv>0,1,v=>Math.round(v)],mva:['MVP Awards',s=>s.mva||0,s=>s.mva>0,1,v=>v],runs:['Most Runs',s=>s.r,s=>s.i>0,1,v=>v],hs:['Highest Score',s=>s.h,s=>s.i>0,1,v=>v],avg:['Batting Avg',s=>s.o?s.r/s.o:s.r,s=>s.b>=12,1,v=>v.toFixed(1)],sr:['Strike Rate',s=>s.r*100/s.b,s=>s.b>=12,1,v=>v.toFixed(1)],f4:['Most 4s',s=>s.f,s=>s.f>0,1,v=>v],s6:['Most 6s',s=>s.s,s=>s.s>0,1,v=>v],h5:['Most 50s',s=>s.h5,s=>s.h5>0,1,v=>v],h1:['Most 100s',s=>s.h1,s=>s.h1>0,1,v=>v],wk:['Most Wickets',s=>s.bw,s=>s.bi>0,1,v=>v],ec:['Best Economy',s=>s.br*6/s.bb,s=>s.bb>=12,0,v=>v.toFixed(2)],ba:['Bowling Avg',s=>s.br/s.bw,s=>s.bw>0,0,v=>v.toFixed(1)],bf:['Best Figures',s=>s.bf*1000-s.bfr,s=>s.bf>0,1,(v,s)=>s.bf+'/'+s.bfr]},d=D[k],rows=A.filter(d[2]).map(s=>({s,v:d[1](s)})).sort((a,b)=>d[3]?b.v-a.v:a.v-b.v).slice(0,10);
app(`<h2>📊 Tournament Stats</h2><div class="r">${Object.entries(D).map(([x,y])=>`<button class="${x==k?'p':''}" onclick="tstats('${x}')">${y[0]}</button>`).join('')}</div><div class="card"><b>${d[0]}</b><table><tr><th>#</th><th>Player</th><th>Team</th><th>Inns</th><th>${d[0]}</th></tr>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${x.s.n}</td><td>${x.s.t}</td><td>${x.s.i||x.s.bi}</td><td><b>${d[4](x.v,x.s)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mu">No data yet — play some matches.</td></tr>'}</table><div class="mu">Averages, strike rate and economy need at least 2 overs/12 balls.</div></div><button onclick="tui()">← Back</button>`)}
function tsq(i){const T=S.T,t=T.teams[i],z={i:0,r:0,b:0,o:0,f:0,s:0,h5:0,h1:0,bb:0,br:0,bw:0,bf:0,bfr:0};app(`<h2 class="r">${jersey(t.j,t.j.num,'',40)}${t.name} — squad stats</h2><div class="card" style="overflow:auto"><table><tr><th>Player</th><th>Inn</th><th>Runs</th><th>Avg</th><th>SR</th><th>4s</th><th>6s</th><th>50/100</th><th>Wkts</th><th>Eco</th><th>Best</th></tr>${t.xi.map(p=>{const s=T.st[p.n+'|'+t.name]||z;return`<tr><td>${p.n}${p.bn==4?' (C)':p.bn==2?' (VC)':''}</td><td>${s.i}</td><td>${s.r}</td><td>${s.i?(s.o?s.r/s.o:s.r).toFixed(1):'-'}</td><td>${s.b?(s.r*100/s.b).toFixed(0):'-'}</td><td>${s.f}</td><td>${s.s}</td><td>${s.h5}/${s.h1}</td><td>${s.bw}</td><td>${s.bb?(s.br*6/s.bb).toFixed(1):'-'}</td><td>${s.bf?s.bf+'/'+s.bfr:'-'}</td></tr>`}).join('')}</table></div><button onclick="tui()">← Back</button>`)}
function hasSave(){try{return !!localStorage.getItem('cc-save')}catch(e){return false}}
function sbtn(){return S.on?'':'<button onclick="saveG()">💾 Save</button>'}
function saveG(){try{const T=S.T,t=S.tm,d={S:{mode:S.mode,on:S.on,n:S.n,N:S.N,pitch:S.pitch,dim:S.dim,tname:S.tname,j:S.j},tm:t&&{name:t.name,j:t.j,sq:t.sq.map(p=>p.id),xi:t.xi&&t.xi.map(p=>p.id),bw:t.bw,c:t.c,vc:t.vc,ov:t.ov,wk:t.wk}};if(T)d.T={i:T.i,fin:T.fin,st:T.st,fix:T.fix.map(f=>f.map(x=>T.teams.indexOf(x))),teams:T.teams.map(x=>({name:x.name,j:x.j,xi:x.xi.map(p=>p.id),bw:x.bw.map(p=>p.id),ov:x.ov.map(p=>p.id),c:(x.xi.find(p=>p.bn==4)||{}).id,vc:(x.xi.find(p=>p.bn==2)||{}).id,wk:(x.wk||{}).id,pts:x.pts,w:x.w,l:x.l}))};localStorage.setItem('cc-save',JSON.stringify(d));say('System','Game saved 💾');alert('Game saved!')}catch(e){alert('Save failed')}}
function loadG(){try{const d=JSON.parse(localStorage.getItem('cc-save')),P=i=>POOL[i];S=Object.assign({},d.S,{st:1,sp:1});if(d.tm){const t=d.tm;S.tm={name:t.name,j:t.j,sq:t.sq.map(P),xi:t.xi&&t.xi.map(P),bw:t.bw,c:t.c,vc:t.vc,ov:t.ov,wk:t.wk}}if(d.T){const ts=d.T.teams.map(t=>Object.assign(mk(t.name,t.j,t.xi.map(P),t.bw,t.c,t.vc,t.ov,t.wk),{pts:t.pts,w:t.w,l:t.l}));S.T={H:ts[0],teams:ts,fix:d.T.fix.map(f=>f.map(i=>ts[i])),i:d.T.i,fin:d.T.fin,st:d.T.st};S.names=ts.slice(1).map(t=>t.name);tui()}else S.tm&&S.tm.xi?lineup():S.tm?pick():menu()}catch(e){alert('Could not load save')}}
function editXI(){const T=S.T,H=T.H,k=[H.pts,H.w,H.l];lineup(()=>{const t=S.tm;Object.assign(H,mk(t.name,t.j,t.xi,t.bw,t.c,t.vc,t.ov,t.wk),{pts:k[0],w:k[1],l:k[2]});tui()})}
function mvpCalc(i1,i2,w){const m={},add=(p,t,v,x)=>{const k=p.n+'|'+t.name,e=m[k]||(m[k]={n:p.n,t:t.name,pts:t.name==w.name?3:0,tx:[]});e.pts+=v;e.tx.push(x)};[i1,i2].forEach(I=>{I.bt.xi.forEach((p,i)=>{if(i>=I.nx)return;const s=I.sc[i];add(p,I.bt,s.r+s.f+2*s.s+(s.r>=100?25:s.r>=50?10:0)-(s.o&&!s.r?5:0)+(s.b>4?Math.max(-8,Math.min(15,(s.r*100/s.b-120)*s.b/100*.25)):0),`${s.r}(${s.b}) bat`)});for(const n in I.bs){const b=I.bs[n],p=I.bl.xi.find(x=>x.n==n);add(p,I.bl,b.w*25+(b.b>=6?Math.max(-15,Math.min(20,(8-b.r*6/b.b)*b.b/6*1.5)):0),`${b.w}/${b.r} bowl`)}});return Object.values(m).sort((a,b)=>b.pts-a.pts)}
function recM(M){const st=S.T.st;M.forEach((e,i)=>{const a=st[e.n+'|'+e.t];if(a){a.mv=(a.mv||0)+e.pts;if(i==0)a.mva=(a.mva||0)+1}})}
function tmvp(){const a=Object.values(S.T.st).sort((x,y)=>(y.mv||0)-(x.mv||0))[0];return a?`<p>⭐ <b>Tournament MVP:</b> ${a.n} (${a.t}) — ${Math.round(a.mv)} pts</p>`:''}
/* 1v1 & TOUR */
async function start(o){const H=mine(),first=Math.random()<.5,r=first?await match(H,o,H):await match(o,H,H);S.res=()=>{S.tm.xi=null;menu()};rscreen(r,H,'S.res')}
function tstart(){const H=mine(),b=S.names.map(n=>bot(n));const T=S.T={H,teams:[H,...b],fix:[],i:0,fin:0,st:{}};for(let i=0;i<T.teams.length;i++)for(let j=i+1;j<T.teams.length;j++)T.fix.push([T.teams[i],T.teams[j]]);T.fix=sh(T.fix);tui()}
function tui(){const T=S.T,t=[...T.teams].sort((a,b)=>b.pts-a.pts||b.w-a.w);const nxt=T.fix.slice(T.i).find(f=>f.includes(T.H)),done=T.i>=T.fix.length;
app(`<h2>🏆 Tournament ${S.on?'(Online)':''}</h2><div class="card"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr>${t.map((x,i)=>`<tr ${x==T.H?'style="font-weight:800"':''}><td>${i+1}</td><td class="r">${jersey(x.j,x.j.num,'',26)}${x.name} <button onclick="tsq(${T.teams.indexOf(x)})">Squad</button></td><td>${x.w+x.l}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pts}</td></tr>`).join('')}</table></div><div class="r"><button onclick="tstats()">📊 Stats</button>${sbtn()}${done?`<button class="p" onclick="tfin()">Play Final: ${t[0].name} vs ${t[1].name}</button>`:`<button class="p" onclick="tnext()">${nxt?'Play: vs '+(nxt[0]==T.H?nxt[1]:nxt[0]).name:'Finish league'}</button><button onclick="editXI()">Edit XI / Bowling</button>`}</div>`)}
async function tnext(){const T=S.T;while(T.i<T.fix.length){const[a,b]=T.fix[T.i++];if(a==T.H||b==T.H){S.opp=(a==T.H?b:a).name;const r=await match(a,b,T.H);S.res=tui;return rscreen(r,T.H,'S.res')}await match(a,b,null)}tui()}
async function tfin(){const T=S.T,t=[...T.teams].sort((a,b)=>b.pts-a.pts||b.w-a.w),[a,b]=t,h=a==T.H||b==T.H,r=await match(a,b,h?T.H:null),ch=r.w;S.res=menu;app(`<div class="card" style="text-align:center"><div class="big">🏆 CHAMPIONS</div>${jersey(ch.j,ch.j.num,ch.name,200)}<h2>${ch.name}</h2><p>${r.tx}</p><p>${ch==T.H?'You lifted the trophy! 🎉':'Better luck next season.'}</p>${tmvp()}<button class="p" onclick="menu()">Main menu</button></div>`)}
Object.assign(window,{tc,snd,menu,go,pre,jv,pick,ul,add,rm,auto,lineup,lu,mv,bwt,xo,xa,ready,tstats,tsq,saveG,loadG,editXI,tstart,tui,tnext,tfin,stUI});
$('#ci').onkeydown=e=>e.key=='Enter'&&snd();
menu();
</script></body></html>
